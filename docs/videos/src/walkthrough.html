<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StripDeathroll14 mock-up walkthrough</title>
    <link rel="stylesheet" href="../../screenshots/src/common.css" />
    <link rel="stylesheet" href="../../screenshots/src/sdr.css" />
    <style>
      .scene { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
      .video-caption {
        position: absolute; bottom: 0; left: 0; right: 0; z-index: 9000; padding: 14px 20px;
        font-size: 15px; font-weight: 600; text-align: center; color: #fff;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
        text-shadow: 0 1px 4px #000;
      }
      .mockup-banner { font-size: 14px; padding: 8px 16px; }
      /* clear of the bottom caption */
      .chat-panel { bottom: 96px; }
      .chat-line { opacity: 0; }
      .mk-window { height: 600px !important; }
    </style>
  </head>
  <body>
    <div class="game-backdrop"></div>
    <div class="mockup-banner">Mock-up</div>
    <div class="video-caption" id="caption"></div>
    <script src="../../screenshots/src/sdr.js"></script>
    <script>
      // Beats reuse the screenshot scenes (docs/screenshots/src/sdr.js); one caption per beat.
      const scenes = [
        { names: ["setup"], start: 0.0, end: 2.9, caption: "Game tab \u2014 pick the venue, add your party; players sit round the circle in turn order" },
        { names: ["turns", "turnsChat"], start: 2.5, end: 5.4, caption: "Opening rolls pick the starter \u2014 Roll for me sends exactly the command it shows" },
        { names: ["wrong", "wrongChat"], start: 5.0, end: 7.9, caption: "Wrong number? A [Deathroll] alert, and the roll waits: Accept it or ask for a reroll" },
        { names: ["pick", "pickChat"], start: 7.5, end: 10.4, caption: "Roll a 0, 1, 69 or 666 to win \u2014 the winner picks who strips and which piece" },
        { names: ["settings", "world"], start: 10.0, end: 12.9, caption: "World markers: rings and pillars of light in the game world (stand-in shown)" },
        { names: ["messages", "messagesChat"], start: 12.5, end: 15.0, caption: "Messages \u2014 rules, ad and every game line in your own words" },
      ];
      const els = scenes.map((s) => {
        const el = document.createElement("div");
        el.className = "scene";
        document.body.insertBefore(el, document.getElementById("caption"));
        SDR.mount(s.names, el);
        return el;
      });
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const FADE = 0.4;

      window.seekWalkthrough = (t) => {
        let caption = "";
        scenes.forEach((s, i) => {
          const el = els[i];
          const fin = s.start === 0 ? 1 : ease(clamp((t - s.start) / FADE, 0, 1));
          const fout = s.end >= 15 ? 1 : ease(clamp((s.end - t) / FADE, 0, 1));
          el.style.opacity = Math.min(fin, fout);
          el.style.transform = `translateY(${(1 - fin) * 12}px)`;
          // chat lines arrive one by one, as they would in the log
          el.querySelectorAll(".chat-line").forEach((line, k) => {
            line.style.opacity = clamp((t - s.start - 0.2 - k * 0.2) / 0.2, 0, 1);
          });
          if (t >= s.start + (s.start === 0 ? 0 : FADE / 2)) caption = s.caption;
        });
        SDR.animate(document.body, t);
        document.getElementById("caption").textContent = caption;
      };
      window.seekWalkthrough(0);
    </script>
  </body>
</html>
